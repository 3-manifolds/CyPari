name: Windows wheels

on: [push, pull_request]

jobs:
  build_wheels:
    name: Build Windows wheels for 64 bit Python
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}

    steps:       
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        name: Install a Python to use for building
        with:
          python-version: '3.12'
          
      - uses: msys2/setup-msys2@v2
        name: Setup an msys2 environment
        with:
          msystem: UCRT64
          release: false
          update: true
          install: >-
            base-devel
            m4
            bison
            make
            patch
            sed
          pacboy: gcc:p
          path-type: inherit

      - name: Downgrade binutils so that it works
        run: |
          pacman -U --noconfirm https://repo.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-binutils-2.43.1-1-any.pkg.tar.zst
          
      - name: Install cibuildwheel
        run: |
          python -m pip install cibuildwheel==3.3
          
      - name: Build gmp and pari
        run: |
          bash build_pari.sh pari64 gmp64

      - name: Build many wheels
        shell: powershell
        env:
          DISTUTILS_USE_SDK: "1"
          WindowsSdkVersion: "10.0.22621.0"
          INCLUDE: 'C:\Program Files (x86)\Windows Kits\10\include\10.0.22621.0\ucrt;C:\Program Files (x86)\Windows Kits\10\include\10.0.22621.0\um;C:\Program Files (x86)\Windows Kits\10\include\10.0.22621.0\shared'
          LIB: 'C:\Program Files (x86)\Windows Kits\10\lib\10.0.22621.0\ucrt\x64;C:\Program Files (x86)\Windows Kits\10\lib\10.0.22621.0\um\x64'
        run: |
          $msvcDir = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC" | Select-Object -First 1
          $compilerPath = "$($msvcDir.FullName)\bin\Hostx64\x64"          
          $env:PATH = "$compilerPath;$env:PATH"
          $env:CIBW_ENVIRONMENT_WINDOWS = "DISTUTILS_USE_SDK=""1"" WindowsSdkVersion=""10.0.22621.0"" PATH=""$compilerPath;$env:PATH"" INCLUDE=""$env:INCLUDE"" LIB=""$env:LIB"""
          python -m cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v4
        name: Save the wheels as artifacts
        with:
          name: cypari_windows_wheels
          path: ./wheelhouse/*.whl
